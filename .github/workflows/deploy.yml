# Comprueba, construye y publica la web en GitHub Pages.
#   - En cada pull request: solo comprueba (tests + validación).
#   - En cada push a `main` (o a mano desde Actions): comprueba y, si todo va bien, publica.
# Si la comprobación falla, NO se publica nada.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Permisos mínimos: leer el código y publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos pushes seguidos, solo se procesa el último.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests y validación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests de la lógica (progreso, logros, zip)
        run: npm test
      - name: Validación (borradores, enlaces, alt, tamaños)
        run: npm run validate

  build:
    name: Build
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build con Astro
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
